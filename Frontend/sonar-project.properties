# SonarCloud — SmartTax Frontend (Angular / TypeScript uniquement)
#
# Secrets CI : SONAR_ORGANIZATION + SONAR_TOKEN

sonar.projectKey=yassinedhahbi_smarttax-frontend
sonar.projectName=SmartTax Frontend
sonar.organization=yassinedhahbi

sonar.host.url=https://sonarcloud.io

# Analyser uniquement le code Angular (pas workflows, assets, PHP, Python)
sonar.sources=src/app
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/src/assets/**,**/.github/**,**/*.py,**/*.php,**/*.yml,**/*.yaml,**/global-shim.ts
sonar.test.inclusions=**/*.spec.ts

sonar.coverage.exclusions=**/*

# Evite l avertissement Python (fichiers hors scope Angular)
sonar.python.file.suffixes=-

# Quality Gate : rapportee par l integration GitHub App SonarCloud (pas le workflow CI).
sonar.qualitygate.wait=false
